[project]
name = "aegis-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts, timing utilities, fallback helpers, and the plugin service registry used by every AEGIS microservice."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "supabase>=2.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aegis_contracts*"]
